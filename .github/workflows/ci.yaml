# CI: lint / typecheck / test / build verification using uv / ty / ruff
name: CI

on:
  push:
    branches:
      - main
      - master
      - "feature/**"
  pull_request:
  workflow_dispatch:

env:
  PACKAGE_DIR: src

jobs:
  lint:
    name: ruff lint & format-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Setup Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install project dependencies (dev) via uv
        run: uv sync --locked --all-extras --dev

      - name: Run ruff (fail on violations)
        run: uv run ruff check .

  test:
    name: Tests (pytest + coverage)
    runs-on: ubuntu-latest
    needs: [lint]
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install project dependencies (dev) via uv
        run: uv sync --locked --all-extras --dev

      - name: Run tests with coverage
        run: |
          uv run coverage run -m pytest -q
          uv run coverage xml -i
          uv run coverage report

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml-${{ matrix.python-version }}
          path: coverage.xml

  package-check:
    name: Build sdist & wheel (verification)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Setup Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Build distributions with uv
        run: uv build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v6
        with:
          name: dist
          path: dist/
